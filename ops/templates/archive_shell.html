  <button id="fold-all" onclick="foldAll()" title="모든 아티클 접기/펴기 (트러블슈팅·구버전은 기본 접힘)">⊟ 전체 접기/펴기</button>
</div>

<div id="layout">
<nav id="sidebar">
<!-- {{SIDEBAR_NAV}} -->
</nav>

<main id="content">
<!-- {{ARTICLES_CONTENT}} -->
</main>
</div>

<script>
function doSearch() {
  const _raw = document.getElementById('search-input').value.trim().toLowerCase();
  const q = (typeof window.normQ === 'function') ? window.normQ(_raw) : _raw;
  document.body.classList.toggle('searching', !!q);   // 검색 중엔 접힘 무시(본문 노출)
  const articles = document.querySelectorAll('article.article');
  let visible = 0;
  articles.forEach(a => {
    const text = (a.textContent + ' ' + (a.dataset.tags||'')).toLowerCase();
    const show = !q || (typeof window.matchQ === 'function' ? window.matchQ(text, q) : text.includes(q));
    a.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('search-count').textContent = q ? visible + '건 표시 중' : '';
  document.querySelectorAll('.cat-header').forEach(h => {
    let sib = h.nextElementSibling, any = false;
    while (sib && !sib.classList.contains('cat-header')) {
      if (sib.tagName === 'ARTICLE' && sib.style.display !== 'none') any = true;
      sib = sib.nextElementSibling;
    }
    h.style.display = (any || !q) ? '' : 'none';
  });
}
document.querySelectorAll('a.nav-link').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// ── 서버 없는 편집 모드 — 글 바로 수정 · 새 글 추가 · 파일에 저장 ──
// 저장: File System Access API(Chrome·Edge=원본에 바로 기록) / 미지원 시 다운로드. 서버 불필요.
const _CATS = [
  {cls:'b-기초',    badge:'기초용어',    hdr:'기초용어'},
  {cls:'b-프로세스', badge:'프로세스',    hdr:'프로세스'},
  {cls:'b-기술',    badge:'기술설정',    hdr:'기술설정'},
  {cls:'b-트러블',  badge:'트러블슈팅',  hdr:'트러블슈팅'},
  {cls:'b-매뉴얼',  badge:'운영 매뉴얼', hdr:'운영 참조 매뉴얼'},
];
const _EDIT_SEL = '#header h1, #header .subtitle, .at, .st, .dt, .hl-box, .warn-box, .tbl td, .tbl th, .tag, .fb';
// 일괄 contenteditable 토글(수천 개 요소 = 렉) 대신, 클릭한 요소만 그 순간 편집 가능하게(위임)
function toggleEdit(on){
  document.body.classList.toggle('editing', on);
  if(!on) document.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
}
document.addEventListener('click', e=>{
  if(!document.body.classList.contains('editing')) return;
  const t = e.target.closest(_EDIT_SEL);
  if(!t) return;
  if(e.target.closest('a')) e.preventDefault();           // 편집 중엔 본문 링크 이동 막고 편집
  if(t.isContentEditable) return;
  t.setAttribute('contenteditable','true'); t.focus();
  if(document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(e.clientX,e.clientY); if(r){ const s=getSelection(); s.removeAllRanges(); s.addRange(r); } }
});
document.addEventListener('focusout', e=>{
  const t=e.target;
  if(t && t.nodeType===1 && t.getAttribute('contenteditable')==='true') t.removeAttribute('contenteditable');
});
function _esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _slug(s){ const base=(s.toLowerCase().replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40))||'note'; let id=base,n=2; while(document.getElementById(id)) id=base+'-'+(n++); return id; }
function _today(){ return new Date().toISOString().slice(0,10); }
function openAdd(){ document.getElementById('add-cat').innerHTML=_CATS.map(c=>`<option>${c.badge}</option>`).join(''); ['add-title','add-tags','add-body'].forEach(id=>document.getElementById(id).value=''); document.getElementById('add-modal').classList.add('open'); }
function closeAdd(){ document.getElementById('add-modal').classList.remove('open'); }
function addArticle(){
  const title=document.getElementById('add-title').value.trim();
  const badge=document.getElementById('add-cat').value;
  const tags=document.getElementById('add-tags').value.trim();
  const body=document.getElementById('add-body').value.trim();
  if(!title){ alert('제목을 입력하세요'); return; }
  const cat=_CATS.find(c=>c.badge===badge)||_CATS[0];
  const id=_slug(title), today=_today();
  const tagHtml=tags?tags.split(/\s+/).map(t=>`<span class="tag">${_esc(t)}</span>`).join(''):'';
  const bodyHtml=(body||'(내용 없음)').split(/\n\n+/).map(p=>`<p>${_esc(p).replace(/\n/g,'<br>')}</p>`).join('');
  const art=document.createElement('article'); art.className='article'; art.id=id;
  art.setAttribute('data-tags',(title+' '+tags+' '+cat.badge).trim());
  art.innerHTML=`\n  <div class="ah">\n    <div class="at">${_esc(title)}</div>\n    <span class="badge ${cat.cls}">${cat.badge}</span>\n    <span class="db">${today}</span>\n  </div>\n  <div class="tags">${tagHtml}</div>\n  <div class="sec"><div class="dt">${bodyHtml}</div></div>\n`;
  const hdr=[...document.querySelectorAll('#content .cat-header')].find(h=>h.textContent.includes(cat.hdr));
  if(hdr){ let n=hdr.nextElementSibling,last=hdr; while(n&&!n.classList.contains('cat-header')){ last=n; n=n.nextElementSibling; } last.after(art); const cnt=hdr.querySelector('.cnt'); if(cnt) cnt.textContent=(parseInt(cnt.textContent||'0',10)+1); }
  else { document.getElementById('content').appendChild(art); }
  const nav=[...document.querySelectorAll('#sidebar .nav-cat-title')].find(x=>x.textContent.includes(cat.hdr));
  if(nav){ let n=nav.nextElementSibling,last=nav; while(n&&!n.classList.contains('nav-cat-title')){ last=n; n=n.nextElementSibling; } const a=document.createElement('a'); a.className='nav-link'; a.href='#'+id; a.innerHTML=`${_esc(title)}<span class="nd">${today}</span>`; a.addEventListener('click',e=>{ const el=document.getElementById(id); if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'});} }); last.after(a); }
  closeAdd();
  art.scrollIntoView({behavior:'smooth',block:'center'});
  _toast('추가됨 ✓ — 💾저장을 눌러 파일에 기록하세요');
}
function _toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('data-noexport',''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
// 파일 위치 기억(IndexedDB) → 첫 선택 후 폴더 안 찾고 바로 저장
// ⚠ 핸들 키는 앱별 고유(_FS_KEY) — 과거 공용 키('f')가 같은 폴더 대시보드 편집기와 충돌해
// 아카이브 저장이 task-board.html을 덮어쓴 사고(2026-06-10). 파일명 검증도 함께 수행.
const _FS_KEY='sap-archive';
function _fsOpen(){ return new Promise(r=>{ const q=indexedDB.open('tbfs',1); q.onupgradeneeded=()=>q.result.createObjectStore('h'); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }
async function _fsLoad(){ try{ const db=await _fsOpen(); if(!db) return null; return await new Promise(r=>{ const g=db.transaction('h').objectStore('h').get(_FS_KEY); g.onsuccess=()=>r(g.result||null); g.onerror=()=>r(null); }); }catch(e){ return null; } }
async function _fsStore(h){ try{ const db=await _fsOpen(); if(db) db.transaction('h','readwrite').objectStore('h').put(h,_FS_KEY); }catch(e){} }
async function _fsForget(){ window._fh=null; try{ const db=await _fsOpen(); if(db) db.transaction('h','readwrite').objectStore('h').delete(_FS_KEY); }catch(e){} }
async function _pickFileHandle(name){
  let h=window._fh||await _fsLoad();
  if(h&&h.name!==name) h=null;   // 다른 파일을 가리키는 핸들(과거 공용키 충돌 등) 차단
  if(h){ try{ const o={mode:'readwrite'}; if(await h.queryPermission(o)!=='granted'&&await h.requestPermission(o)!=='granted') h=null; }catch(e){ h=null; } }
  if(!h){
    h=await window.showSaveFilePicker({id:_FS_KEY,startIn:'documents',suggestedName:name,types:[{description:'HTML',accept:{'text/html':['.html']}}]});
    if(h.name!==name) _toast('⚠ 선택한 파일명이 '+name+' 이 아닙니다 — 저장 위치를 확인하세요');
    await _fsStore(h);
  }
  window._fh=h; return h;
}
async function saveFile(){
  // 저장 스탬프: 저장본 <html data-saved>에 박고 localStorage에도 기억 → 다음 로드 때
  // "내 마지막 저장이 지금 보는 파일에 실제로 반영됐는지" 대조(불일치 = 다른 위치에 저장됨).
  const stamp='sv-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
  const doc=document.documentElement.cloneNode(true);
  doc.setAttribute('data-saved', stamp);
  doc.querySelectorAll('[data-noexport], #ai-toggle, #ai-panel').forEach(el=>el.remove());   // 편집 UI + (서버 주입) AI 패널 제거
  doc.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  doc.querySelectorAll('.article.hidden').forEach(el=>el.classList.remove('hidden'));          // 검색 필터 해제
  doc.querySelectorAll('.article.collapsed').forEach(el=>el.classList.remove('collapsed'));   // 접힘(뷰 상태)은 저장본에 박지 않음
  doc.querySelectorAll('#content article.article[style], #content .cat-header[style]').forEach(el=>{ el.style.display=''; if(!el.getAttribute('style')) el.removeAttribute('style'); });   // 검색 중 저장 대비 — 인라인 display 잔상 제거
  doc.querySelectorAll('.nav-hide, .nav-f-hide, .nav-collapsed, .nav-on').forEach(el=>el.classList.remove('nav-hide','nav-f-hide','nav-collapsed','nav-on'));   // 탐색 층 뷰 상태 제거
  const b=doc.querySelector('body'); if(b){ b.classList.remove('editing'); b.classList.remove('searching'); b.classList.remove('mode-hub','mode-doc','mode-all'); }
  const html='<!DOCTYPE html>\n'+doc.outerHTML+'\n';
  if(window.showSaveFilePicker){
    try{
      const h=await _pickFileHandle('archive.html');
      const w=await h.createWritable(); await w.write(html); await w.close();
      const f=await h.getFile();                                            // 라운드트립 확인
      if(f.size!==new Blob([html]).size){ _toast('⚠ 저장 검증 실패 — 기록된 크기가 다릅니다. 다시 시도하세요'); return; }
      try{ localStorage.setItem('archive-saved-stamp', stamp); }catch(_e){}
      toggleEdit(false); _toast('파일에 저장됨 ✓ ('+h.name+')'); return;
    }
    catch(e){
      if(e.name==='AbortError'){ _toast('⚠ 저장 취소됨 — 파일에 기록되지 않았습니다'); return; }
      _toast('⚠ 직접 저장 실패('+e.name+') — 다운로드로 대체합니다');
    }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='archive.html'; a.click();
  try{ localStorage.setItem('archive-saved-stamp', stamp); }catch(_e){}     // 원본에 덮어쓰기 전까지 로드 시 경고 배너가 알려줌
  toggleEdit(false); _toast('다운로드됨 — 원본 archive.html에 덮어쓰세요');
}
// 로드 시: 마지막 저장 스탬프가 이 파일에 없으면 = 저장이 딴 데로 갔다는 뜻 → 경고
document.addEventListener('DOMContentLoaded', ()=>{
  // file://(더블클릭)에선 브라우저가 원본 직접쓰기(File System Access)를 막음 → 사본 다운로드만 가능.
  // 원본에 바로 저장하려면 http://localhost(로컬 서버) 또는 https 필요. → file://이면 버튼을 '다운로드'로.
  if(!window.showSaveFilePicker || location.protocol==='file:'){
    const b=document.getElementById('btn-save');
    if(b){ b.textContent='💾 다운로드'; b.title='더블클릭(file://)에선 원본에 직접 못 써 사본만 다운로드됩니다. 원본에 바로 저장하려면 로컬 서버로 여세요: 1_서버_개인모드.bat → http://localhost:5174'; }
    const h=document.getElementById('edit-hint'); if(h) h.classList.add('is-file');
  }
  try{
    const want=localStorage.getItem('archive-saved-stamp');
    if(!want || document.documentElement.getAttribute('data-saved')===want) return;
    const d=document.createElement('div'); d.setAttribute('data-noexport','');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#7c2d12;color:#fff;padding:10px 16px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';
    d.innerHTML='⚠ <b>마지막 💾저장이 이 파일에 반영되어 있지 않습니다.</b> 저장이 다른 위치의 파일로 갔거나, 다운로드본을 아직 원본에 덮어쓰지 않은 상태일 수 있어요.';
    const btn=document.createElement('button'); btn.textContent='저장 위치 재선택';
    btn.style.cssText='background:#fff;color:#7c2d12;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700';
    btn.onclick=async()=>{ await _fsForget(); localStorage.removeItem('archive-saved-stamp'); d.remove(); _toast('기억한 저장 위치를 지웠습니다 — 다음 💾저장 때 파일을 다시 고르세요'); };
    const x=document.createElement('button'); x.textContent='확인(닫기)';
    x.style.cssText='background:transparent;color:#fff;border:1px solid #ffffff88;border-radius:6px;padding:4px 10px;cursor:pointer';
    x.onclick=()=>{ localStorage.removeItem('archive-saved-stamp'); d.remove(); };
    d.append(btn,x); document.body.appendChild(d);
  }catch(e){}
});

// ── 아티클 접기/펴기 (긴 트러블슈팅·구버전 가시성) ──
(function(){
  const KEY='archive-fold';
  let pref={}; try{ pref=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ pref={}; }
  // 기본 접힘 = 트러블슈팅 카테고리 + .old(구버전) 표시 아티클
  function defaultCollapsed(a){ return a.classList.contains('old') || !!a.querySelector('.badge.b-트러블, .badge.b-매뉴얼'); }
  function applyAll(){
    document.querySelectorAll('article.article').forEach(a=>{
      const id=a.id||'';
      const c=(id && id in pref) ? (pref[id]==='c') : defaultCollapsed(a);
      a.classList.toggle('collapsed', c);
    });
  }
  applyAll();
  // 헤더(.ah) 클릭 = 토글 (편집모드·본문 링크 제외)
  document.addEventListener('click', function(e){
    if(document.body.classList.contains('editing')) return;
    const ah=e.target.closest('.ah'); if(!ah) return;
    const a=ah.closest('article.article'); if(!a) return;
    if(e.target.closest('a')) return;
    const c=a.classList.toggle('collapsed');
    if(a.id){ pref[a.id]=c?'c':'o'; try{ localStorage.setItem(KEY,JSON.stringify(pref)); }catch(_e){} }
  });
  // 전체 접기/펴기 (열린 게 하나라도 있으면 전부 접고, 다 접혀 있으면 전부 펴기)
  window.foldAll=function(){
    const arts=[...document.querySelectorAll('article.article')];
    const collapse=arts.some(a=>!a.classList.contains('collapsed'));
    arts.forEach(a=>{ a.classList.toggle('collapsed', collapse); if(a.id) pref[a.id]=collapse?'c':'o'; });
    try{ localStorage.setItem(KEY,JSON.stringify(pref)); }catch(_e){}
  };
})();
</script>






<!-- ── Obsidian식 backlink 패널 + 태그칩 필터 (data-related/태그 시각화) — 2026-06-24 추가 ── -->
<style>
.rel-panel{margin-top:14px;padding:9px 12px;border-top:1px dashed #cbd5e1;background:#f8fafc;border-radius:0 0 6px 6px;font-size:.8rem}
.rel-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0}
.rel-lbl{color:#64748b;font-weight:700;font-size:.72rem;margin-right:4px;white-space:nowrap}
.rel-chip{display:inline-block;padding:2px 9px;background:#e0e7ff;color:#3730a3;text-decoration:none;font-size:.75rem;border:1px solid #c7d2fe;border-radius:11px;cursor:pointer}
.rel-chip:hover{background:#c7d2fe}
.tags .tag{cursor:pointer}
.tags .tag:hover{filter:brightness(.95)}
.collapsed .rel-panel{display:none}
</style>
<script>
// data-related(아티클 간 연결)를 화면 backlink 패널로, #태그를 클릭 필터로 시각화.
// 패널은 동적 렌더(data-noexport=저장 제외) — 메타 원본은 article의 data-related 속성에만 영구 보존.
(function(){
  document.addEventListener('DOMContentLoaded', function(){
    var arts = [].slice.call(document.querySelectorAll('article.article'));
    var byId = {}; arts.forEach(function(a){ if(a.id) byId[a.id]=a; });
    var back = {};
    arts.forEach(function(a){
      var rel=(a.dataset.related||'').trim(); if(!rel) return;
      rel.split(/\s+/).forEach(function(t){ (back[t]=back[t]||[]).push(a.id); });
    });
    function title(id){ var a=byId[id]; var t=a&&a.querySelector('.at'); return t?t.textContent:id; }
    function chip(id){ return byId[id] ? '<a href="#'+id+'" class="rel-chip" data-goto="'+id+'">'+title(id)+'</a>' : ''; }
    arts.forEach(function(a){
      var fwd=(a.dataset.related||'').trim().split(/\s+/).filter(function(x){return x&&byId[x];});
      var bk=(back[a.id]||[]).filter(function(x){return byId[x] && fwd.indexOf(x)<0;});
      if(!fwd.length && !bk.length) return;
      var p=document.createElement('div'); p.className='rel-panel'; p.setAttribute('data-noexport','');
      var h='';
      if(fwd.length) h+='<div class="rel-row"><span class="rel-lbl">🔗 관련</span>'+fwd.map(chip).join('')+'</div>';
      if(bk.length)  h+='<div class="rel-row"><span class="rel-lbl">↩ 여기를 참조</span>'+bk.map(chip).join('')+'</div>';
      p.innerHTML=h; a.appendChild(p);
    });
    document.addEventListener('click', function(e){
      if(document.body.classList.contains('editing')) return;
      var c=e.target.closest('.rel-chip');
      if(c){ e.preventDefault(); var t=byId[c.getAttribute('data-goto')]; if(t){ t.classList.remove('collapsed'); t.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
      var tag=e.target.closest('.tags .tag');
      if(tag){ e.preventDefault(); var inp=document.getElementById('search-input'); if(inp){ inp.value=tag.textContent.replace(/^#/,'').trim(); if(typeof doSearch==='function') doSearch(); window.scrollTo({top:0,behavior:'smooth'}); } }
    });
  });
})();
</script>


<!-- ══════════════════════════════════════════════════════════════════════════════
     탐색 층(Navigator) — 2026-08-20 추가
     목적: 정본 파일(archive.html 한 벌)은 그대로 두고 "찾아 들어가는 보기 층"만 얹는다.
       ① 🧭 색인(허브)  — T-Code / 테이블 / 케이스 / 주제 / 최근 역인덱스.
                          파일에 저장하지 않고 로드할 때 DOM에서 매번 계산
                          → 아티클을 추가·수정해도 자동 반영(사람이 동기화할 목록 0개).
       ② 📄 문서 모드   — 사이드바·색인에서 고른 글 "한 편만" 표시. :target(URL 해시) 기반이라

<script>

  var SYN = { '버젼': '버전' };
  function normQ(q){
    q = (q || '').toLowerCase();
    Object.keys(SYN).forEach(function(k){ q = q.split(k).join(SYN[k]); });

  }
  window.normQ = normQ;   // doSearch(맨 위 검색창)는 이 블록보다 먼저 정의된 별도 스크립트라 전역으로 공유

  // "매출품의"와 "버전"이 각각 어딘가에 있으면 매칭 — 종전 "문구 그대로 붙어있어야" 방식이던 실제 결함 수정.
  function matchQ(text, q){
    if(!q) return true;
    var toks = q.split(/\s+/).filter(Boolean);

  function buildIndex(){
    if(IX) return IX;
    var tcode = {}, table = {};
    function add(map, k, id){ (map[k] = map[k] || {})[id] = 1; }
    arts.forEach(function(a){

      while((m = RE_Z.exec(txt))){ (/^ZT/.test(m[0]) ? add(table, m[0], a.id) : add(tcode, m[0], a.id)); }
      RE_STD_T.lastIndex = 0;
      while((m = RE_STD_T.exec(txt))) add(tcode, m[0], a.id);
      RE_STD_TBL.lastIndex = 0;
      while((m = RE_STD_TBL.exec(txt))) add(table, m[0], a.id);
    });
    IX = { tcode: tcode, table: table };
    return IX;
  }

        var k = (T(a) + ' ' + tags + ' ' + (a.dataset.tags || '')).toLowerCase();
        return '<a class="hub-card" href="#' + a.id + '" data-k="' + esc(k) + '">' +
               '<div class="t">' + esc(T(a)) + '</div>' +
               '<div class="m">' + esc(D(a)) + (tags ? ' · ' + esc(tags) : '') + '</div></a>';
      }).join('') + '</div>';
  }

  function chip(a){ return '<a class="lk" href="#' + a.id + '">' + esc(T(a)) + '</a>'; }

  function renderTopics(){
    var html = '<div class="hub-note">카테고리는 글이 놓인 자리, 주제는 글을 가로지르는 묶음입니다. 한 글이 여러 주제에 동시에 들어갑니다.</div>';
    // ① 카테고리(사이드바와 동일한 5분류)
    var cats = {};
    arts.forEach(function(a){ if(!a.id) return; var b = B(a) || '기타'; (cats[b] = cats[b] || []).push(a); });
    html += '<div class="hub-sec"><div class="hub-fam">📂 카테고리</div>';
    Object.keys(cats).forEach(function(b){
      var k = (b + ' ' + cats[b].map(T).join(' ')).toLowerCase();
      html += '<div class="hub-topic" data-k="' + esc(k) + '"><div class="tt">' + esc(b) +
              '<span class="n">' + cats[b].length + '</span></div>' + cats[b].map(chip).join('') + '</div>';
    });
    html += '</div>';
    // ② 주제 클러스터
    html += '<div class="hub-sec"><div class="hub-fam">🧵 주제로 가로지르기</div>';
    TOPICS.forEach(function(tp){
      var hit = arts.filter(function(a){
        if(!a.id) return false;
        // data-tags(AI 검색용 키워드 덤프)가 아니라 제목 + 사람이 붙인 태그칩으로 매칭
        // — 덤프로 매칭하면 한 주제가 전체의 절반을 삼켜 색인 구실을 못 한다.
        var s = (T(a) + ' ' + $$('.tags .tag', a).map(function(t){ return t.textContent; }).join(' ')).toLowerCase();
        return tp.k.some(function(w){ return s.indexOf(w) >= 0; });
      });
      if(!hit.length) return;
      var k = (tp.t + ' ' + tp.k.join(' ') + ' ' + hit.map(T).join(' ')).toLowerCase();
      html += '<div class="hub-topic" data-k="' + esc(k) + '"><div class="tt">' + esc(tp.t) +
              '<span class="n">' + hit.length + '</span></div>' + hit.map(chip).join('') + '</div>';
    });
    return html + '</div>';
  }

  function renderRecent(){
    var list = arts.filter(function(a){ return a.id; }).slice();
    list.sort(function(x, y){ return D(y).localeCompare(D(x)); });
    return '<div class="hub-note">기록 날짜 최신 순 전체 ' + list.length + '건.</div>' +
      list.map(function(a){
        var k = (T(a) + ' ' + B(a) + ' ' + (a.dataset.tags || '')).toLowerCase();
        return '<a class="hub-row" href="#' + a.id + '" data-k="' + esc(k) + '">' +
               '<span class="t">' + esc(T(a)) + '</span>' +
               '<span class="d">' + esc(B(a)) + ' · ' + esc(D(a)) + '</span></a>';
      }).join('');
  }

  function buildHub(){
    if(hubReady) return;
    var ix = buildIndex();
    var nT = Object.keys(ix.tcode).length, nB = Object.keys(ix.table).length;
    var sub = $('#nav-hub .hub-h .sub');
    if(sub) sub.textContent = '아티클 ' + arts.length + ' · T-Code ' + nT + ' · 테이블 ' + nB +
                              ' — 열 때마다 본문에서 자동 생성(파일에 저장되지 않음)';
    var nCase = arts.filter(function(a){ return a.querySelector('.badge.b-트러블'); }).length;
    var tabs = [
      { id:'case',   t:'🔧 케이스 '  + nCase },
      { id:'tcode',  t:'🧩 T-Code '  + nT },
      { id:'table',  t:'🗄️ 테이블 '  + nB },
      { id:'topic',  t:'📚 주제·분류' },
      { id:'recent', t:'🕒 최근' }
    ];
    $('#nav-hub .hub-tabs').innerHTML = tabs.map(function(t){
      return '<button type="button" data-tab="' + t.id + '">' + t.t + '</button>';
    }).join('');
    hubReady = true;
    showTab(curTab);
  }

  function showTab(id){
    curTab = id;
    $$('#nav-hub .hub-tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === id); });
    var ix = buildIndex(), html;
    if(id === 'tcode')       html = renderCodes(ix.tcode, famT,   ['🔎 조회·리포트 (ZR)','⚙️ 배치·프로그램 (ZB)','🖥️ 화면·모듈풀 (ZE)','🧩 기타 Z','📗 SAP 표준 T-Code'], 'tc');
    else if(id === 'table')  html = renderCodes(ix.table, famTbl, ['🗄️ 커스텀 테이블 (ZT)','📗 SAP 표준 테이블'], 'tbl');
    else if(id === 'topic')  html = renderTopics();
    else if(id === 'recent') html = renderRecent();
    else                     html = renderCases();
    $('#hub-body').innerHTML = html;
    var f = $('#hub-filter'); if(f && f.value) hubFilter(f.value);
  }

  function hubFilter(q){
    q = normQ((q || '').trim());
    $$('#hub-body [data-k]').forEach(function(el){
      el.style.display = matchQ(el.getAttribute('data-k'), q) ? '' : 'none';
    });
    $$('#hub-body .hub-sec').forEach(function(s){
      var any = $$('[data-k]', s).some(function(e2){ return e2.style.display !== 'none'; });
      s.style.display = any ? '' : 'none';
    });
  }

  // ══ 모드 전환 ═════════════════════════════════════════════════════════
  function resetSearch(){
    var i = $('#search-input');
    if(i && i.value){ i.value = ''; if(typeof doSearch === 'function') doSearch(); }
    // 검색이 남긴 인라인 display 잔상 정리
    arts.forEach(function(a){ if(a.style.display) a.style.display = ''; });
    $$('#content .cat-header').forEach(function(h){ if(h.style.display) h.style.display = ''; });
  }

  function applyMode(m){
    var b = document.body;
    b.classList.remove('mode-hub','mode-doc','mode-all');
    b.classList.add('mode-' + m);
    $$('#nav-modes button').forEach(function(x){ x.classList.toggle('on', x.dataset.mode === m); });
    if(m === 'hub'){ resetSearch(); buildHub(); cur = null; markNav(null); }
    if(m === 'doc'){ refreshDoc(); }
    if(m === 'all'){ cur = null; markNav(null); }
    try { localStorage.setItem(LS_MODE, m === 'doc' ? 'hub' : m); } catch(e){}   // 문서 모드는 기억하지 않음 → 다음 방문은 색인부터
    if(m !== 'all'){ var c = $('#content'); if(c) c.scrollTop = 0; }
  }

  function refreshDoc(){
    var id = (location.hash || '').replace(/^#/, ''), a = byId[id];
    if(!a){ applyMode('hub'); return; }
    cur = a;
    a.classList.remove('collapsed');                       // 문서 모드에선 항상 펼침
    var bar = $('#doc-bar');
    if(bar){
      var p = arts[a._ix - 1], n = arts[a._ix + 1];
      $('.db-crumb', bar).textContent = B(a) + ' ›';
      $('.db-title', bar).textContent = T(a);
      var pb = $('.db-prev', bar), nb = $('.db-next', bar);
      pb.disabled = !p; nb.disabled = !n;
      pb.title = p ? T(p) : ''; nb.title = n ? T(n) : '';
    }
    markNav(id);
    var c = $('#content'); if(c) c.scrollTop = 0;
  }

  function go(id){
    if(!byId[id]) return;
    resetSearch();
    if((location.hash || '').replace(/^#/, '') === id){ applyMode('doc'); }
    else { location.hash = id; applyMode('doc'); }        // :target 기반 → 딥링크·뒤로가기 유지
  }
  function step(d){ if(cur && arts[cur._ix + d]) go(arts[cur._ix + d].id); }

  function markNav(id){
    $$('#sidebar a.nav-link.nav-on').forEach(function(a){ a.classList.remove('nav-on'); });
    if(!id) return;
    var link = $('#sidebar a.nav-link[href="#' + id + '"]');
    if(!link) return;
    var g = groups.filter(function(gr){ return gr.links.indexOf(link) >= 0; })[0];
    if(g && g.title.classList.contains('nav-collapsed')) setGroup(g, true), saveGroups();
    link.classList.add('nav-on');
    if(link.scrollIntoView) link.scrollIntoView({ block: 'nearest' });
  }

  function setGroup(g, open){
    g.title.classList.toggle('nav-collapsed', !open);
    g.links.forEach(function(a){ a.classList.toggle('nav-hide', !open); });
  }
  function saveGroups(){
    var o = {};
    groups.forEach(function(g, i){ o[i] = !g.title.classList.contains('nav-collapsed'); });
    try { localStorage.setItem(LS_CAT, JSON.stringify(o)); } catch(e){}
  }

  function navFilter(q){
    q = normQ((q || '').trim());
    if(!q){
      $$('#sidebar .nav-f-hide').forEach(function(e){ e.classList.remove('nav-f-hide'); });
      var st = {}; try { st = JSON.parse(localStorage.getItem(LS_CAT) || '{}'); } catch(e){}
      groups.forEach(function(g, i){ setGroup(g, st[i] !== false); });
      return;
    }
    groups.forEach(function(g){
      var any = false;
      g.links.forEach(function(a){
        var id = (a.getAttribute('href') || '').slice(1);
        // 제목만이 아니라 그 글 본문 전체까지 본다 — 제목엔 안 나오고 본문에만 있는 사실도 찾아지도록
        var art = byId[id];
        var s = (a.textContent + ' ' + (art ? (art.dataset.tags || '') + ' ' + art.textContent : '')).toLowerCase();
        var hit = matchQ(s, q);
        a.classList.toggle('nav-f-hide', !hit);
        a.classList.remove('nav-hide');                    // 찾는 동안엔 접힘 무시
        if(hit) any = true;
      });
      g.title.classList.toggle('nav-f-hide', !any);
      g.title.classList.remove('nav-collapsed');
    });
  }

  // ══ 이벤트 ════════════════════════════════════════════════════════════
  function wire(){
    // capture 단계 — 기존 nav-link 스크롤 핸들러보다 먼저 잡는다
    document.addEventListener('click', function(e){
      if(document.body.classList.contains('editing')) return;
      var t = e.target;
      var mb = t.closest('#nav-modes button'); if(mb){ applyMode(mb.dataset.mode); return; }
      if(t.closest('#nav-hub-btn') || t.closest('.db-hub')){ applyMode('hub'); return; }
      if(t.closest('.db-all')){ var k = cur; applyMode('all'); if(k) setTimeout(function(){ k.scrollIntoView({ block:'start' }); }, 0); return; }
      if(t.closest('.db-prev')){ step(-1); return; }
      if(t.closest('.db-next')){ step(1);  return; }
      var tb = t.closest('#nav-hub .hub-tabs button'); if(tb){ showTab(tb.dataset.tab); return; }
      var ct = t.closest('#sidebar .nav-cat-title');
      if(ct){
        var g = groups.filter(function(x){ return x.title === ct; })[0];
        if(g){ setGroup(g, ct.classList.contains('nav-collapsed')); saveGroups(); }
        return;
      }
      var lk = t.closest('#sidebar a.nav-link, #nav-hub a[href^="#"]');
      if(lk){ e.preventDefault(); e.stopPropagation(); go(lk.getAttribute('href').slice(1)); return; }
      // 문서 모드에서 본문 안 상호참조 링크(관련 글·rel-chip)도 페이지 이동으로
      var al = t.closest('#content a[href^="#"]');
      if(al && document.body.classList.contains('mode-doc')){
        var id = al.getAttribute('href').slice(1);
        if(byId[id]){ e.preventDefault(); e.stopPropagation(); go(id); return; }
      }
      // 태그칩 클릭(기존 기능: 검색어로 넣기) → 결과가 보이도록 전체 모드로
      if(t.closest('#content .tags .tag')){ setTimeout(function(){ applyMode('all'); }, 0); }
    }, true);

    var si = $('#search-input');
    if(si) si.addEventListener('input', function(){
      if(si.value.trim() && !document.body.classList.contains('mode-all')) applyMode('all');
    });
    var nf = $('#nav-filter'); if(nf) nf.addEventListener('input', function(){ navFilter(nf.value); });
    var hf = $('#hub-filter'); if(hf) hf.addEventListener('input', function(){ hubFilter(hf.value); });

    window.addEventListener('hashchange', function(){
      var id = (location.hash || '').replace(/^#/, '');
      if(byId[id] && !document.body.classList.contains('mode-all')) applyMode('doc');
    });

    document.addEventListener('keydown', function(e){
      if(document.body.classList.contains('editing')) return;
      var t = e.target, tag = ((t && t.tagName) || '').toLowerCase();
      var typing = (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable));
      if(e.key === 'Escape'){ if(typing) t.blur(); applyMode('hub'); }
      else if(e.key === '/' && !typing){ e.preventDefault(); var i = $('#search-input'); if(i) i.focus(); }
      else if(!typing && document.body.classList.contains('mode-doc')){
        if(e.key === 'ArrowLeft')  step(-1);
        if(e.key === 'ArrowRight') step(1);
      }
    });

    // AI 검색 패널(서버가 런타임 주입)이 근거 아티클로 점프할 때 — 색인/문서 모드면 그 글로 이동시킨 뒤 스크롤
    if(typeof window.scrollToArticle === 'function'){
      var _sa = window.scrollToArticle;
      window.scrollToArticle = function(id){
        var clean = String(id == null ? '' : id).replace('#', '');
        if(byId[clean] && !document.body.classList.contains('mode-all')) go(clean);
        return _sa.apply(this, arguments);
      };
    }

    // 편집 모드로 들어가면 전체 보기로 (기존 편집·저장 동작을 건드리지 않기 위해)
    if(typeof window.toggleEdit === 'function'){
      var _te = window.toggleEdit;
      window.toggleEdit = function(on){ if(on) applyMode('all'); return _te.apply(this, arguments); };
    }
  }

  // ══ 시작 ══════════════════════════════════════════════════════════════
  function init(){
    arts = $$('#content article.article');
    if(!arts.length) return;
    arts.forEach(function(a, i){ a._ix = i; if(a.id) byId[a.id] = a; });
    injectModeBar(); injectSidebar(); injectBars(); wire();
    var h = (location.hash || '').replace(/^#/, '');
    if(byId[h]) applyMode('doc');
    else applyMode(localStorage.getItem(LS_MODE) === 'all' ? 'all' : 'hub');
  }

  function boot(){
    try { init(); }
    catch(err){
      // 이 층이 실패해도 아카이브 본문은 기존 그대로 보여야 한다
      document.body.classList.remove('mode-hub','mode-doc');
      console.warn('[탐색 층] 초기화 실패 — 기존 전체 보기로 계속합니다.', err);
    }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body></html>
